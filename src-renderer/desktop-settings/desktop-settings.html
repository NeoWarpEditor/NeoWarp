      // 复用页面上的轻量反馈：AI 行内不引入新 toast 样式，临时挂起即撤
      let aiNoteTimer = null;
      function showToastTransient (message, isError) {
        const note = document.getElementById('aiSharedNote');
        if (!note) return;
        note.textContent = message;
        note.style.color = isError ? 'var(--danger)' : 'var(--success)';
        if (aiNoteTimer) clearTimeout(aiNoteTimer);
        aiNoteTimer = setTimeout(() => {
          note.textContent = aiS.note;
          note.style.color = '';
        }, 2200);
      }

      // ── 免费模型活动 ──
      // 截止时间与主进程 ai-model-configs.js 的 FREE_MODEL_END_AT 一致：
      // 2026-11-30 12:00:00（UTC+8）＝ 04:00 UTC。过期后灰显且不可选；
      // 免费配置由主进程动态注入，不提供编辑/删除（避免展示内置密钥）。
      const AI_FREE_END_AT = Date.UTC(2026, 10, 30, 4, 0, 0);
      const aiIsFreeConfig = (cfg) =>
        !!cfg && (cfg.isFree === true || String(cfg.id || '').indexOf('free_') === 0);
      const aiFreeExpired = (cfg) =>
        aiIsFreeConfig(cfg) && (cfg.freeExpired === true || Date.now() >= AI_FREE_END_AT);

      function aiGroupHead (title, note) {
        const head = document.createElement('div');
        head.className = 'ai-group-head';
        head.innerHTML = '<span class="ai-group-title">' + aiEscape(title) + '</span>' +
          (note ? '<span class="ai-group-note">' + aiEscape(note) + '</span>' : '');
        return head;
      }

      function aiModelRow (cfg) {
        const p = AI_PROVIDERS[cfg.provider] || {};
        const modelLabel = p.isCustom
          ? (cfg.customModelId || cfg.model)
          : (((p.models || []).find((m) => m.id === cfg.model) || {}).name || cfg.model);
        const isActive = cfg.id === aiActiveId;
        const isFree = aiIsFreeConfig(cfg);
        const expired = aiFreeExpired(cfg);

        const row = document.createElement('div');
        row.className = 'setting-row ai-model-row' + (expired ? ' free-expired' : '');
        row.style.cursor = expired ? 'not-allowed' : 'pointer';
        row.innerHTML =
          '<div class="ai-provider-logo" style="background:' + (p.logo || '#888') + ';">' +
            (AI_LOGO_SVG[cfg.provider] || aiEscape(p.logoText || '?')) + '</div>' +
          '<div class="setting-info">' +
            '<div class="setting-label">' + aiEscape(cfg.name || modelLabel || aiProviderName(cfg.provider) || aiS.unnamed) + '</div>' +
            '<div class="setting-desc">' + aiEscape(
              isFree
                ? aiProviderName(cfg.provider) + ' · 1M ' + aiS.ctxSuffix
                : aiProviderName(cfg.provider) + (modelLabel ? ' · ' + modelLabel : '')) +
              (!isFree && !cfg.apiKey ? ' · ' + aiEscape(aiS.noKey) : '') + '</div>' +
          '</div>' +
          '<div class="setting-control">' +
            (expired
              ? '<span class="ai-free-tag expired">' + aiEscape(aiS.freeEnded) + '</span>'
              : (isActive
                  ? '<span class="ai-active-tag">' + aiEscape(aiS.active) + '</span>'
                  : (isFree ? '<span class="ai-free-tag">' + aiEscape(aiS.freeBadge) + '</span>' : ''))) +
            (isFree ? '' :
              '<button type="button" class="ai-row-btn ai-edit-btn">' + aiEscape(aiS.edit) + '</button>' +
              '<button type="button" class="ai-row-btn danger ai-delete-btn">' + aiEscape(aiS.delete) + '</button>') +
          '</div>';

        row.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          if (expired) {
            showToastTransient(aiS.freeEnded, true);
            return;
          }
          aiSetActive(cfg.id);
        });
        if (!isFree) {
          row.querySelector('.ai-edit-btn').addEventListener('click', () => openAiModelDialog(cfg.id));
          row.querySelector('.ai-delete-btn').addEventListener('click', () => aiDeleteConfig(cfg.id));
        }
        return row;
      }

      function renderAiModelList () {
        const list = document.getElementById('aiModelList');
        if (!list) return;
        list.innerHTML = '';

        if (!aiConfigs.length) {
          const empty = document.createElement('div');
          empty.className = 'ai-empty-row';
          empty.textContent = aiS.noModels;
          list.appendChild(empty);
        }

        // 免费模型在前单独成组（点选即用、无密钥、不可编辑删除），用户自己的配置排后面
        const freeRows = [];
        const ownRows = [];
        aiConfigs.forEach((cfg) => {
          (aiIsFreeConfig(cfg) ? freeRows : ownRows).push(cfg);
        });
        if (freeRows.length) {
          list.appendChild(aiGroupHead(aiS.freeModelsTitle, aiS.freeGroupNote));
        }
        freeRows.forEach((cfg) => list.appendChild(aiModelRow(cfg)));
        if (ownRows.length) {
          list.appendChild(aiGroupHead(aiS.myModelsTitle, ''));
        }
        ownRows.forEach((cfg) => list.appendChild(aiModelRow(cfg)));

        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'row-button';
        addBtn.innerHTML =
          '<div class="row-icon icon-blue">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
          '</div><span class="row-text"></span>';
        addBtn.querySelector('.row-text').textContent = aiS.addModel;
        addBtn.addEventListener('click', () => openAiModelDialog(null));
        list.appendChild(addBtn);
      }

      function aiDeleteConfig (id) {
        if (aiConfigs.length <= 1) {
          showToastTransient(aiS.keepOneConfig);
          return;
        }
        const idx = aiConfigs.findIndex((c) => c.id === id);
        if (idx === -1) return;
        if (!confirm(aiS.deleteConfirm)) return;
        const name = aiConfigs[idx].name || aiS.unnamed;
        aiConfigs.splice(idx, 1);
        if (aiActiveId === id) {
          aiActiveId = aiConfigs.length ? aiConfigs[Math.min(idx, aiConfigs.length - 1)].id : null;
        }
        renderAiModelList();
        aiSaveConfigs();
        showToastTransient(aiS.modelDeleted.replace('{name}', name));
      }

      // 新增/编辑共用对话框；id 为 null 表示新增
      function openAiModelDialog (id) {
        const isEdit = typeof id === 'string';
        const cfg = isEdit ? aiConfigs.find((c) => c.id === id) : null;
        const draft = {
          name: (cfg && cfg.name) || '',
          provider: (cfg && cfg.provider) || 'openai',
          model: (cfg && cfg.model) || '',
          apiFormat: (cfg && cfg.apiFormat) || 'openai',
          customEndpoint: (cfg && cfg.customEndpoint) || '',
          customModelId: (cfg && cfg.customModelId) || '',
          apiKey: (cfg && cfg.apiKey) || '',
          customContextLimit: (cfg && cfg.customContextLimit) || 1000000
        };
        if (!draft.model) {
          const firstModel = ((AI_PROVIDERS[draft.provider] || {}).models || [])[0];
          draft.model = firstModel ? firstModel.id : '';
        }

        const overlay = document.createElement('div');
        overlay.className = 'ai-dialog-overlay open';
        const panel = document.createElement('div');
        panel.className = 'ai-dialog';

        const isCustomProvider = () => !!(AI_PROVIDERS[draft.provider] || {}).isCustom;
        let dialogModels = ((AI_PROVIDERS[draft.provider] || {}).models || []).slice();
        let selectedModels = new Set(draft.model ? [draft.model] : []);

        const providerGridHtml = () => Object.keys(AI_PROVIDERS)
          // 免费模型不作为“服务商”参与添加/编辑，只在模型列表中直接选用
          .filter((k) => !AI_PROVIDERS[k].isFree)
          .map((k) => {
          const p = AI_PROVIDERS[k];
          return '<button type="button" class="provider-option' +
            (draft.provider === k ? ' selected' : '') + '" data-provider="' + k + '">' +
            '<span class="provider-option-logo" style="background:' + (p.logo || '#888') + ';">' +
            (AI_LOGO_SVG[k] || aiEscape(p.logoText || '?')) + '</span>' +
            '<span class="provider-option-name">' + aiEscape(aiProviderName(k)) + '</span>' +
            '</button>';
        }).join('');

        const modelListHtml = () => {
          return dialogModels.map((m) => {
            const meta = [];
            if (m.contextLimit) meta.push(aiFormatTokenCount(m.contextLimit) + ' ' + aiS.ctxSuffix);
            if (m.maxOutput) meta.push(aiFormatTokenCount(m.maxOutput) + ' ' + aiS.outSuffix);
            let tags = '';
            if (m.supportsReasoning) tags += '<span class="model-cap-tag">' + aiEscape(aiS.capReasoning) + '</span>';
            if (m.supportsVision !== false && (AI_PROVIDERS[draft.provider] || {}).supportsVision !== false) {
              tags += '<span class="model-cap-tag">' + aiEscape(aiS.capVision) + '</span>';
            }
            return '<button type="button" class="model-option' +
              (selectedModels.has(m.id) ? ' selected' : '') + '" data-model="' + aiEscape(m.id) + '" aria-pressed="' + selectedModels.has(m.id) + '">' +
              '<span class="model-option-body">' +
              '<span class="model-option-name">' + aiEscape(m.name) + '</span>' +
              (meta.length ? '<span class="model-option-meta">' + aiEscape(meta.join(' · ')) + '</span>' : '') +
              '</span>' +
              (tags ? '<span>' + tags + '</span>' : '') +
              '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
              '</button>';
          }).join('');
        };

        const fieldRow = (rowId, label, inner, hint) =>
          '<div class="ai-field-row" id="' + rowId + '">' +
          '<label class="ai-field-label">' + aiEscape(label) + '</label>' +
          inner +
          (hint ? '<div class="ai-field-hint">' + aiEscape(hint) + '</div>' : '') +
          '<div class="ai-field-error"></div>' +
          '</div>';

        panel.innerHTML =
          '<div class="ai-dialog-head">' + aiEscape(isEdit ? aiS.editTitle : aiS.addTitle) + '</div>' +
          '<div class="ai-dialog-body">' +
          '<div class="form-group"><div class="form-group-label">' + aiEscape(aiS.groupProvider) + '</div>' +
          '<div class="provider-grid" id="aiProviderGrid">' + providerGridHtml() + '</div></div>' +
          '<div class="form-group" id="aiModelGroup"><div class="form-group-heading"><div class="form-group-label">' + aiEscape(aiS.groupModel) + '</div>' +
          '<button type="button" class="ai-fetch-models-btn" id="aiFetchModelsBtn">' + aiEscape(aiS.fetchLatestModels) + '</button></div>' +
          '<div class="model-option-list" id="aiModelListDialog">' + modelListHtml() + '</div>' +
          '<div class="ai-field-error" id="aiModelSelectionError"></div></div>' +
          '<div class="form-group" id="aiEndpointGroup"><div class="form-group-label">' + aiEscape(aiS.groupEndpoint) + '</div>' +
          fieldRow('aiApiFormatRow', aiS.fieldApiFormat,
            '<div id="aiApiFormat" data-custom-select></div>') +
          fieldRow('aiEndpointRow', aiS.fieldEndpoint,
            '<input type="text" id="aiEndpoint" class="settings-input settings-input-mono" placeholder="https://api.example.com/v1" value="' + aiEscape(draft.customEndpoint) + '">' +
            '<div class="ai-field-hint" id="aiEndpointHint"></div>') +
          fieldRow('aiModelIdRow', aiS.fieldModelId,
            '<div class="ai-custom-model-tools"><textarea id="aiModelId" class="settings-input settings-input-mono" placeholder="gpt-6.1-sol&#10;deepseek-flash" spellcheck="false">' + aiEscape(draft.customModelId) + '</textarea>' +
            '<button type="button" class="ai-fetch-models-btn" id="aiFetchCustomModelsBtn">' + aiEscape(aiS.fetchAvailableModels) + '</button></div>',
            aiS.fieldModelIdHint) +
          fieldRow('aiCtxLimitRow', aiS.fieldContextLimit,
            '<input type="text" inputmode="numeric" id="aiCtxLimit" class="settings-input" placeholder="1000000" value="' + aiEscape(String(draft.customContextLimit)) + '">',
            aiS.fieldContextLimitHint) +
          '</div>' +
          '<div class="form-group"><div class="form-group-label">' + aiEscape(aiS.groupCredentials) + '</div>' +
          fieldRow('aiApiKeyRow', aiS.fieldApiKey,
            '<div class="settings-input-group">' +
            '<input type="password" id="aiApiKey" class="settings-input settings-input-mono" placeholder="sk-..." value="' + aiEscape(draft.apiKey) + '" autocomplete="off" spellcheck="false">' +
            '<button type="button" class="settings-input-affix" id="aiKeyToggle">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>' +
            '</button></div>', aiS.fieldApiKeyHint) +
          fieldRow('aiNameRow', aiS.fieldName,
            '<input type="text" id="aiName" class="settings-input" placeholder="' + aiEscape(aiProviderName(draft.provider)) + '" value="' + aiEscape(draft.name) + '">',
            aiS.fieldNameHint) +
          '</div>' +
          '</div>' +
          '<div class="ai-dialog-foot">' +
          '<div class="test-result" id="aiTestResult"></div>' +
          '<button type="button" class="btn btn-secondary" id="aiTestBtn">' + aiEscape(aiS.testConnection) + '</button>' +
          '<button type="button" class="btn btn-secondary" id="aiCancelBtn">' + aiEscape(aiS.cancel) + '</button>' +
          '<button type="button" class="btn" id="aiSaveBtn">' + aiEscape(aiS.save) + '</button>' +
          '</div>';

        overlay.appendChild(panel);
        document.body.appendChild(overlay);

        const $ = (sel) => panel.querySelector(sel);
        const fmtSel = $('#aiApiFormat');
        const fmtSelect = new CustomSelect(fmtSel, {
          block: true,
          items: Object.keys(AI_API_FORMATS).map((format) => ({
            value: format,
            label: aiApiFormatName(format)
          })),
          value: draft.apiFormat
        });
        const endpointIn = $('#aiEndpoint');
        const modelIdIn = $('#aiModelId');
        const keyIn = $('#aiApiKey');
        const ctxIn = $('#aiCtxLimit');
        const nameIn = $('#aiName');
        const testResult = $('#aiTestResult');

        function syncGroups () {
          const custom = isCustomProvider();
          $('#aiModelGroup').style.display = custom ? 'none' : '';
          $('#aiEndpointGroup').style.display = custom ? '' : 'none';
          nameIn.placeholder = aiProviderName(draft.provider);
        }
        syncGroups();

        $('#aiProviderGrid').addEventListener('click', (e) => {
          const btn = e.target.closest('.provider-option');
          if (!btn) return;
          draft.provider = btn.dataset.provider;
          dialogModels = ((AI_PROVIDERS[draft.provider] || {}).models || []).slice();
          selectedModels = new Set(dialogModels[0] ? [dialogModels[0].id] : []);
          draft.model = dialogModels[0] ? dialogModels[0].id : '';
          panel.querySelectorAll('.provider-option').forEach((b) => {
            b.classList.toggle('selected', b.dataset.provider === draft.provider);
          });
          $('#aiModelListDialog').innerHTML = modelListHtml();
          syncGroups();
          clearErrors();
          setTestResult('', '');
        });

        $('#aiModelListDialog').addEventListener('click', (e) => {
          const btn = e.target.closest('.model-option');
          if (!btn) return;
          const modelId = btn.dataset.model;
          if (selectedModels.has(modelId)) {
            selectedModels.delete(modelId);
          } else {
            selectedModels.add(modelId);
          }
          draft.model = modelId;
          btn.classList.toggle('selected', selectedModels.has(modelId));
          btn.setAttribute('aria-pressed', String(selectedModels.has(modelId)));
          $('#aiModelSelectionError').textContent = '';
          setTestResult('', '');
        });

        // 接口地址输入框下方的示例 URL 跟随所选 API 格式变化；
        // OpenAI 兼容格式额外提示支持 base URL 自动补全，Anthropic/Ollama
        // 需要自己的请求路径，不会触发补全
        function syncEndpointHint () {
          const hintEl = $('#aiEndpointHint');
          if (!hintEl) return;
          const f = AI_API_FORMATS[fmtSel.value] || {};
          const parts = [];
          const fmtHint = aiLang === 'zh' ? (f.endpointHintZh || '') : (f.endpointHintEn || '');
          if (fmtHint) parts.push(fmtHint);
          if (fmtSel.value === 'openai' || fmtSel.value === 'custom') parts.push(aiS.endpointAutoHint);
          hintEl.textContent = parts.join(aiLang === 'zh' ? '；' : ' · ');
        }
        syncEndpointHint();
        fmtSel.addEventListener('change', () => {
          const def = (AI_API_FORMATS[fmtSel.value] || {}).defaultEndpoint;
          if (def && !endpointIn.value.trim()) endpointIn.value = def;
          syncEndpointHint();
        });

        $('#aiKeyToggle').addEventListener('click', function () {
          const showing = keyIn.type === 'text';
          keyIn.type = showing ? 'password' : 'text';
          this.title = showing ? aiS.showKey : aiS.hideKey;
        });

        function clearErrors () {
          panel.querySelectorAll('.ai-field-row.has-error').forEach((el) => {
            el.classList.remove('has-error');
            const err = el.querySelector('.ai-field-error');
            if (err) err.textContent = '';
          });
        }
        function setError (rowSel, message) {
          const row = $(rowSel);
          row.classList.add('has-error');
          row.querySelector('.ai-field-error').textContent = message;
        }
        const SPINNER_SVG = '<svg class="ai-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>';
        const OK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        const FAIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        function setTestResult (state, text) {
          testResult.className = 'test-result' + (state ? ' ' + state : '');
          if (!text) {
            testResult.innerHTML = '';
            return;
          }
          const icon = state === 'ok' ? OK_SVG : (state === 'fail' ? FAIL_SVG : SPINNER_SVG);
          testResult.innerHTML = icon + '<span>' + aiEscape(text) + '</span>';
        }

        function collect () {
          clearErrors();
          const custom = isCustomProvider();
          let ok = true;
          const key = keyIn.value.trim();
          const endpoint = endpointIn.value.trim();
          const modelIds = Array.from(new Set(modelIdIn.value.split(/[\s,，;；]+/).map((id) => id.trim()).filter(Boolean)));
          const ctx = parseInt(ctxIn.value.replace(/[^\d]/g, ''), 10);

          if (custom) {
            if (!endpoint) {
              setError('#aiEndpointRow', aiS.errEndpointRequired);
              ok = false;
            } else if (/\s/.test(endpoint)) {
              // 规范化会自动补协议并补全 /chat/completions，这里只挡明显非法的输入
              setError('#aiEndpointRow', aiS.errEndpointInvalid);
              ok = false;
            }
            if (!modelIds.length) {
              setError('#aiModelIdRow', aiS.errModelIdRequired);
              ok = false;
            }
            if (isNaN(ctx) || ctx < 1000) {
              setError('#aiCtxLimitRow', aiS.errContextLimit);
              ok = false;
            }
          }
          if (!custom && !selectedModels.size) {
            $('#aiModelSelectionError').textContent = aiS.errModelRequired;
            ok = false;
          }
          if (!key) {
            setError('#aiApiKeyRow', aiS.errKeyRequired);
            ok = false;
          }
          if (!ok) {
            const firstErr = panel.querySelector('.ai-field-row.has-error .settings-input');
            if (firstErr) firstErr.focus();
            return null;
          }
          const base = {
            name: nameIn.value.trim(),
            provider: draft.provider,
            apiKey: key,
            apiFormat: custom ? fmtSel.value : 'openai',
            customEndpoint: custom ? normalizeCustomEndpoint(endpoint) : '',
            customContextLimit: custom ? ctx : 1000000,
            thinkingLevel: (cfg && cfg.thinkingLevel) || 'medium'
          };
          return (custom ? modelIds : dialogModels.filter((m) => selectedModels.has(m.id)).map((m) => m.id)).map((modelId) => {
            const model = dialogModels.find((m) => m.id === modelId);
            return Object.assign({}, base, {
              name: base.name || (custom ? modelId : ((model && model.name) || aiProviderName(draft.provider) || 'Model')),
              model: custom ? 'custom' : modelId,
              customModelId: custom ? modelId : ''
            });
          });
        }

        function close () {
          fmtSelect.destroy();
          overlay.classList.remove('open');
          document.removeEventListener('keydown', onKey);
          setTimeout(() => {
            if (overlay.parentNode) overlay.remove();
          }, 200);
        }
        function onKey (e) {
          if (e.key === 'Escape') {
            e.stopPropagation();
            close();
          }
        }
        document.addEventListener('keydown', onKey);
        // 仅通过“取消”按钮或 Esc 关闭对话框；点击遮罩不关闭，避免误触丢失已填内容
        $('#aiCancelBtn').addEventListener('click', close);

        // 测试连接：经 tw-ai-proxy 转发（主进程无 CORS 限制），不可用时直连。
        // Authorization 等请求头必须编码进 &h= 传给转发层（与 ai-assistant.html
        // 的 buildAiProxyUrl 同一套编码），否则主进程只会转发一个无鉴权的裸请求
        let aiProxyBroken = false;
        const buildProxyUrl = (endpoint, headers) => {
          let url = 'tw-ai-proxy://request/?u=' + encodeURIComponent(endpoint);
          if (headers && Object.keys(headers).length) {
            const json = JSON.stringify(headers);
            url += '&h=' + encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
          }
          return url;
        };

        // 获取服务商账号当前可用的模型。OpenAI 兼容接口使用 GET /models，
        // Anthropic 使用 GET /v1/models，Ollama 使用 GET /api/tags。
        const fetchModels = async (custom) => {
          const btn = $(custom ? '#aiFetchCustomModelsBtn' : '#aiFetchModelsBtn');
          const key = keyIn.value.trim();
          const format = custom ? fmtSel.value : 'openai';
          clearErrors();
          if (format !== 'ollama' && !key) {
            setError('#aiApiKeyRow', aiS.modelsFetchKeyRequired);
            setTestResult('fail', aiS.modelsFetchKeyRequired);
            return;
          }
          let chatEndpoint;
          if (custom) {
            const input = endpointIn.value.trim();
            if (!input || /\s/.test(input)) {
              setError('#aiEndpointRow', input ? aiS.errEndpointInvalid : aiS.errEndpointRequired);
              return;
            }
            chatEndpoint = normalizeCustomEndpoint(input);
          } else {
            chatEndpoint = (AI_PROVIDERS[draft.provider] || {}).endpoint;
          }
          const headers = format === 'anthropic'
            ? {'x-api-key': key, 'anthropic-version': '2023-06-01'}
            : (format === 'ollama' ? {} : {'Authorization': 'Bearer ' + key});
          const suffix = format === 'anthropic' ? '/v1/messages' : (format === 'ollama' ? '/api/chat' : '/chat/completions');
          const listPath = format === 'ollama' ? '/api/tags' : (format === 'anthropic' ? '/v1/models' : '/models');
          const listEndpoint = chatEndpoint.replace(new RegExp(suffix.replace(/\//g, '\\/') + '$', 'i'), listPath);
          btn.disabled = true;
          setTestResult('busy', aiS.fetchingModels);
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 15000);
          try {
            const options = {method: 'GET', headers, signal: controller.signal};
            let response;
            try {
              response = await fetch(buildProxyUrl(listEndpoint, headers), options);
            } catch (error) {
              if (error && error.name === 'AbortError') throw error;
              response = await fetch(listEndpoint, options);
            }
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error((body.error && (body.error.message || body.error.type)) || ('HTTP ' + response.status));
            }
            const rawModels = Array.isArray(body.data) ? body.data : (Array.isArray(body.models) ? body.models : []);
            const ids = Array.from(new Set(rawModels.map((m) => typeof m === 'string' ? m : (m.id || m.name || m.model)).filter(Boolean)));
            if (!ids.length) throw new Error(aiS.modelsFetchEmpty);
            if (custom) {
              const existing = modelIdIn.value.split(/[\s,，;；]+/).map((id) => id.trim()).filter(Boolean);
              const merged = Array.from(new Set(existing.concat(ids)));
              modelIdIn.value = merged.join('\n');
              setTestResult('ok', aiS.customModelsFetched.replace('{count}', ids.length));
            } else {
              const known = (AI_PROVIDERS[draft.provider] || {}).models || [];
              dialogModels = ids.map((id) => Object.assign({}, known.find((m) => m.id === id) || {id, name: id}));
              selectedModels = new Set(ids);
              $('#aiModelListDialog').innerHTML = modelListHtml();
              $('#aiModelSelectionError').textContent = '';
              setTestResult('ok', aiS.modelsFetched.replace('{count}', ids.length));
            }
          } catch (error) {
            const message = error && error.name === 'AbortError' ? 'timeout' : (error.message || 'network error');
            setTestResult('fail', aiS.modelsFetchFail + ': ' + String(message).slice(0, 150));
          } finally {
            clearTimeout(timer);
            btn.disabled = false;
          }
        };
        $('#aiFetchModelsBtn').addEventListener('click', () => fetchModels(false));
        $('#aiFetchCustomModelsBtn').addEventListener('click', () => fetchModels(true));

        $('#aiTestBtn').addEventListener('click', function () {
          const data = collect();
          if (!data) return;
          const first = data[0];
          const p = AI_PROVIDERS[first.provider] || {};
          const endpoint = p.isCustom ? normalizeCustomEndpoint(first.customEndpoint || p.endpoint) : p.endpoint;
          if (!endpoint) return;
          const modelId = p.isCustom ? first.customModelId : first.model;
          const btn = this;
          btn.disabled = true;
          setTestResult('busy', aiS.testing);
          const controller = new AbortController();
          const options = {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + first.apiKey},
            body: JSON.stringify({model: modelId, messages: [{role: 'user', content: 'ping'}], max_tokens: 1, stream: false}),
            signal: controller.signal
          };
          const doFetch = (url) => aiProxyBroken
            ? fetch(url, options)
            : fetch(buildProxyUrl(url, options.headers), options).catch((err) => {
              if (err && err.name === 'AbortError') throw err;
              aiProxyBroken = true;
              return fetch(url, options);
            });
          const zh = aiLang === 'zh';
          // 只认 JSON / event-stream 应答：某些中转（One API / New API 等）会把
          // 不带 /v1 的路径当成控制台首页，回 HTTP 200 + HTML；此前只看 resp.ok
          // 会把这种响应误报成“连接成功”，等真正聊天时才发现端点不可用。
          const contentTypeOf = (resp) => String((resp.headers && resp.headers.get('content-type')) || '');
          const isSseOrJson = (ct) => /json|event-stream/i.test(ct);
          const v1Endpoint = endpoint.replace(/\/chat\/completions$/i, '/v1/chat/completions');
          const htmlHint = (zh
            ? '（返回的是网页而非对话接口；One API / New API 类中转的接口地址应带 /v1，如 https://主机/v1/chat/completions）'
            : ' (endpoint returned a webpage, not a chat API; One API / New API relays need /v1, e.g. https://host/v1/chat/completions)');
          let timer = 0;
          const armTimer = () => {
            clearTimeout(timer);
            timer = setTimeout(() => controller.abort(), 15000);
          };
          const runAttempt = (url) => {
            armTimer();
            return doFetch(url).then((resp) => {
              clearTimeout(timer);
              return resp;
            });
          };
          const tryHtmlFallback = (firstResp) => {
            // 200 但不是 JSON/SSE：先自动改用 /v1/chat/completions 复测一次，
            // 成功就把修正后的端点回填输入框，省得聊天时再踩一遍坑
            if (v1Endpoint !== endpoint) {
              return runAttempt(v1Endpoint).then((v1Resp) => {
                if (v1Resp.ok && isSseOrJson(contentTypeOf(v1Resp))) {
                  endpointIn.value = v1Endpoint;
                  setTestResult('ok', aiS.testOk + (zh ? '（已自动改用 /v1/chat/completions）' : ' (auto-switched to /v1/chat/completions)'));
                  return;
                }
                const v1Status = v1Resp.ok ? '' : (zh ? '，改用 /v1 后仍失败（HTTP ' + v1Resp.status + '）' : '; /v1 retry also failed (HTTP ' + v1Resp.status + ')');
                setTestResult('fail', aiS.testFail + ': ' + (zh
                  ? '端点返回' + (v1Resp.ok ? '网页' : ' HTTP ' + v1Resp.status) + '而非对话接口' + v1Status + htmlHint
                  : 'HTTP 200 with HTML' + v1Status + htmlHint));
              });
            }
            setTestResult('fail', aiS.testFail + ': ' + (zh
              ? 'HTTP 200 但端点返回' + (contentTypeOf(firstResp) ? contentTypeOf(firstResp).split(';')[0] : '未知类型') + htmlHint
              : 'HTTP 200 with ' + (contentTypeOf(firstResp).split(';')[0] || 'unknown type') + htmlHint));
          };
          runAttempt(endpoint).then((resp) => {
            const ct = contentTypeOf(resp);
            if (resp.ok && !isSseOrJson(ct)) return tryHtmlFallback(resp);
            if (resp.ok) {
              setTestResult('ok', aiS.testOk);
              return;
            }
            return resp.json().catch(() => ({})).then((j) => {
              const msg = (j && j.error && (j.error.message || j.error.type)) || ('HTTP ' + resp.status);
              const htmlNote = /text\/html/i.test(ct) ? htmlHint : '';
              setTestResult('fail', aiS.testFail + ': ' + htmlNote + String(msg).slice(0, 100));
            });
          }).catch((err) => {
            clearTimeout(timer);
            const msg = err && err.name === 'AbortError' ? 'timeout' : (err && err.message) || 'network error';
            setTestResult('fail', aiS.testFail + ': ' + String(msg).slice(0, 150));
          }).then(() => {
            btn.disabled = false;
          });
        });

        $('#aiSaveBtn').addEventListener('click', () => {
          const configs = collect();
          if (!configs) return;
          if (isEdit) {
            Object.assign(cfg, configs[0]);
            configs.slice(1).forEach((data, index) => {
              data.id = 'cfg_' + Date.now() + '_' + index;
              aiConfigs.push(data);
            });
          } else {
            configs.forEach((data, index) => {
              data.id = 'cfg_' + Date.now() + '_' + index;
              aiConfigs.push(data);
            });
          }
          aiActiveId = configs[configs.length - 1].id;
          renderAiModelList();
          aiSaveConfigs();
          close();
          showToastTransient(isEdit ? aiS.configSaved : aiS.modelAdded);
        });

        setTimeout(() => {
          const body = panel.querySelector('.ai-dialog-body');
          const target = keyIn.value ? nameIn : keyIn;
          target.focus({preventScroll: true});
          if (body) body.scrollTop = 0;
        }, 60);
      }

      DesktopSettingsPreload.getAiModelConfigs().then(({configs, activeId}) => {
        aiConfigs = configs || [];
        aiActiveId = activeId || null;
        renderAiModelList();
      });
      DesktopSettingsPreload.onAiModelConfigsChanged(({configs, activeId}) => {
        aiConfigs = configs || [];
        aiActiveId = activeId || null;
        // 对话框打开期间不重绘底层列表，避免编辑中的表单被覆盖观感打断
        if (!document.querySelector('.ai-dialog')) renderAiModelList();
      });
    </script>
  </body>
</html>
